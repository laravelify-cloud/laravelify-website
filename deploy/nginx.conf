# nginx site for laravelify.cloud. Install it with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/laravelify.cloud
#   sudo ln -sf /etc/nginx/sites-available/laravelify.cloud /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see the README); it adds the HTTPS part to this file.

server {
    listen 80;
    listen [::]:80;
    server_name laravelify.cloud www.laravelify.cloud;

    # www → root
    if ($host = www.laravelify.cloud) {
        return 301 https://laravelify.cloud$request_uri;
    }

    # Next.js build files never change for a given name: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
